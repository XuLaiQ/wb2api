# One service, one image and one data layout for the merged application.
# FastAPI supervises the embedded Go gateway on 127.0.0.1:7863.

services:
  wb2api:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: workbuddy/wb2api:latest
    container_name: wb2api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      WB_RUN_MODE: integrated
      WB2API_MODE: integrated
      WB_MANAGER_HOST: 0.0.0.0
      WB_MANAGER_PORT: 7864
      WB2API_BASE: http://127.0.0.1:7863
      WB2API_BINARY: /usr/local/bin/wb2api
      WB_UPSTREAM_DIR: /app
      WB_AUTH_DIR: /app/data/auths
      WB_UPSTREAM_CONFIG: /app/config.json
      WB_DATA_DIR: /app/data/manager
      WB_STATIC_DIR: /app/web/out
      WB2API_LOG_FILE: /app/data/gateway/server.log
      WB_ADMIN_PASSWORD: ${WB_ADMIN_PASSWORD:-}
      WB_TRUST_PROXY: ${WB_TRUST_PROXY:-1}
      WB_ENABLE_DOCS: ${WB_ENABLE_DOCS:-0}
      WB_HTTP_PROXY: ${WB_HTTP_PROXY:-}
    ports:
      - "127.0.0.1:7864:7864"
    volumes:
      # The container runs as uid 10001; prepare bind mounts with:
      #   chown -R 10001:10001 data
      - ./data:/app/data
      - ./config.json:/app/config.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7864/api/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
