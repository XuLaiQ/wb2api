# WorkBuddy 一体化部署 —— 上游网关 + 管理面板，一个 compose 起全部
#
#   docker compose up -d --build
#   浏览器打开 http://127.0.0.1:7864
#   首次启动未设 WB_ADMIN_PASSWORD 时，随机密码会打印到管理端日志：
#     docker compose logs workbuddy-manager | grep -A2 密码
#
# 目录约定（本文件位于仓库根，两个子项目是它的子目录）：
#   upstream/   上游 workbuddy2api（Go，:7863）—— OpenAI 兼容网关
#   manager/    管理面板 + 对外网关（FastAPI + Next.js，:7864）
#
# 与「分别用各自 compose 起两个项目」的区别，只有编排，没有代码分叉：
#   · 两个服务在同一自定义网络里，管理端用**服务名**直连上游，不经宿主机网络栈；
#   · 数据卷集中在各自子目录下（upstream/auths、upstream/data、manager/data），
#     备份和迁移只需拷仓库目录；
#   · 端口默认只绑 127.0.0.1 —— 原上游 compose 是 `7863:7863`（公网可达），
#     由管理端的更新脚本事后收敛；这里在建 compose 时就绑好，不再依赖「更新后修正」。
#
# 只想跑其中一个？两个子目录各自保留着独立可用的 docker-compose.yml，
# 进对应目录 `docker compose up -d --build` 即可，互不影响。

services:
  # ── 上游：把腾讯 CodeBuddy 账号池包装成 OpenAI 兼容接口 ──────────
  workbuddy2api:
    build:
      context: ./upstream
    image: workbuddy2api:latest
    # 容器名必须与 manager 的 WB2API_CONTAINER 一致（默认值就是 workbuddy2api）：
    # 管理端「重启上游」走的是 `docker restart workbuddy2api`，只认容器名。
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      # 只监听本机。上游的 api_key 是明文 bearer，暴露到公网等于把账号池送人。
      # 对外一律经管理端 :7864（那里才有密钥分发、IP 管控、调用审计）。
      # 确需直连时改成 "7863:7863"，但请先确认你不需要上面那些能力。
      - "127.0.0.1:7863:7863"
    volumes:
      # 账号凭证。管理端扫码加号会往这里落盘 workbuddy-<uid>.json（见
      # manager 的 tencent.write_auth_file），所以**不能只读**。
      #
      # 权限：容器内进程 uid=10001，而 bind mount 的属主由宿主机决定，
      # 镜像里的 chown 不起作用。若管理端显示「0 个账号」而这里明明有文件，
      # 在仓库根执行一次：chown -R 10001:10001 ./upstream/auths
      - ./upstream/auths:/app/auths
      # 运行状态（state.json、日志）。同上，写不进去时：
      #   chown -R 10001:10001 ./upstream/data
      - ./upstream/data:/app/data
      # 配置。上游启动时读一次，之后由管理端的「重载」触发重读。
      # 这里对上游是只读，对管理端是读写（见下面 manager 的挂载）。
      - ./upstream/config.json:/app/config.json:ro
    networks:
      - wb2api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7863/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 管理端：Web 面板 + 对外网关（Anthropic / Responses 协议转换）──
  workbuddy-manager:
    build:
      context: ./manager
    image: workbuddy-manager:latest
    container_name: workbuddy-manager
    restart: unless-stopped
    depends_on:
      workbuddy2api:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      # 同一 compose 网络内用**服务名**，比 host.docker.internal 少一跳、
      # 也不受宿主防火墙影响。若上游在别处（另一台机 / 另一个 compose 项目），
      # 改成 http://host.docker.internal:7863 并把下面的 extra_hosts 打开。
      WB2API_BASE: http://workbuddy2api:7863
      # docker = 通过挂载的 docker.sock 操作上游容器；native = 走启停脚本。
      WB2API_MODE: docker
      WB2API_CONTAINER: workbuddy2api
      # 容器内我们确实是容器，显式声明省掉一次探测（update.py 据此决定
      # 「不能重启自己、交给 compose 的 restart 策略」）。
      WB_RUN_MODE: docker
      # 上游目录。留空也能跑 —— 默认值 /opt/workbuddy2api 正是下面的挂载点；
      # 显式写出来是为了让「管理端读哪个目录」在配置里一眼可见。
      WB_UPSTREAM_DIR: /opt/workbuddy2api
      # 反向代理在后面时，真实 IP 取自它覆盖写入的 X-Real-IP
      WB_TRUST_PROXY: "1"
      # 生产环境不暴露 /docs 与 /openapi.json
      WB_ENABLE_DOCS: "0"
      # 首启管理员密码；不设则随机生成并打印到日志（推荐首启后立即改）
      # WB_ADMIN_PASSWORD: "改成你的强密码"
    ports:
      # 同样只监听本机：管理端持有全部账号凭据，必须藏在反向代理之后。
      # 若确需从别的机器直连，改成 "7864:7864"，但请先确保有 HTTPS 与访问控制。
      - "127.0.0.1:7864:7864"
    volumes:
      # 数据库、日志、更新状态、上游版本固定标记。必须持久化，
      # 否则重建容器会丢统计与审计记录。
      # 权限：首次由 docker 自动创建时归 root，而容器以 uid 10001 运行，
      # 会报 `sqlite3.OperationalError: unable to open database file`
      # （报错既不说路径也不说原因）。仓库根执行一次：
      #   chown -R 10001:10001 ./manager/data
      - ./manager/data:/app/data
      # 上游**整个仓库目录**。一次挂载覆盖三件事（分开挂子路径会互相重叠，
      # 反而让权限语义变模糊）：
      #   · 读/写 config.json —— 「设置」页保存的目标
      #   · 读/写 auths/ —— 扫码加号落盘
      #   · 读上游代码目录做版本检测；「更新」时在这里 git pull
      # 注意：这里挂的是**合并仓库的子目录**，不再是外部兄弟仓库，
      # 所以路径推导、更新范围都收敛到本仓库内（见 manager/server/config.py）。
      - ./upstream:/opt/workbuddy2api
      # docker 控制套接字：挂上后管理端才能重启上游容器、读它的日志。
      #
      # 安全性：挂 docker.sock 等于把宿主 root 交给本容器。但这**不是新增的
      # 风险等级** —— 宿主部署时本服务本来就是 root 运行（systemd 单元无 User=），
      # 而 root 的宿主进程本来就能 `docker run -v /:/host` 拿到宿主文件系统。
      # 两者权限等价。
      #
      # 要求最小权限就把这行注释掉：依赖 docker 的功能会自动降级为
      # 「请到宿主机执行 docker compose ...」，界面如实提示，不会静默失败。
      - /var/run/docker.sock:/var/run/docker.sock
    # 仅当 WB2API_BASE 指向 host.docker.internal 时才需要
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    networks:
      - wb2api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7864/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  wb2api:
    driver: bridge
